<svg width="160" height="90" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="90" fill="#1e293b" rx="3"/>
  <text x="80" y="20" font-family="Arial" font-size="12" text-anchor="middle" fill="#06b6d4" font-weight="bold">SPI</text>
  <!-- 主设备 -->
  <rect x="20" y="30" width="40" height="25" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- 从设备 -->
  <rect x="100" y="60" width="35" height="20" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- 信号线 -->
  <line x1="60" y1="40" x2="100" y2="70" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="70" y="35" font-family="Arial" font-size="8" fill="#06b6d4">MOSI</text>
  <line x1="60" y1="50" x2="100" y2="80" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="70" y="55" font-family="Arial" font-size="8" fill="#06b6d4">MISO</text>
  <line x1="60" y1="60" x2="100" y2="90" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="70" y="65" font-family="Arial" font-size="8" fill="#06b6d4">SCK</text>
  <line x1="40" y1="60" x2="40" y2="80" x3="117" y3="80" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="30" y="70" font-family="Arial" font-size="8" fill="#06b6d4" text-anchor="end">CS</text>
</svg>