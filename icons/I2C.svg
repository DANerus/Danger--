<svg width="160" height="80" xmlns="http://www.w3.org/2000/svg">
  <rect width="160" height="80" fill="#1e293b" rx="3"/>
  <text x="80" y="20" font-family="Arial" font-size="12" text-anchor="middle" fill="#06b6d4" font-weight="bold">I2C</text>
  <!-- 主设备 -->
  <rect x="20" y="30" width="40" height="20" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- 从设备 -->
  <rect x="100" y="30" width="30" height="15" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <rect x="100" y="55" width="30" height="15" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- SDA线 -->
  <line x1="60" y1="40" x2="100" y2="40" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="130" y1="40" x2="130" y2="65" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="70" y="35" font-family="Arial" font-size="8" fill="#06b6d4">SDA</text>
  <!-- SCL线 -->
  <line x1="60" y1="50" x2="100" y2="50" stroke="#06b6d4" stroke-width="1.5"/>
  <line x1="130" y1="50" x2="130" y2="75" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="70" y="55" font-family="Arial" font-size="8" fill="#06b6d4">SCL</text>
</svg>